<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Registro de domiciliario')}"></head>
<body>
<div class="access">
  <div class="access-box">
    <div class="access-brand"><i class="bi bi-box-seam-fill"></i><h1>Despacho</h1><p>Solicitud de cuenta de domiciliario</p></div>
    <div class="panel">
      <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
      <form th:action="@{/register}" method="post">
        <div class="mb-2"><label class="form-label" for="name">Nombre completo</label>
          <input class="form-control" id="name" name="name" th:value="${name}" required maxlength="80"></div>
        <div class="row g-2 mb-2">
          <div class="col-6"><label class="form-label" for="idNumber">Cédula</label>
            <input class="form-control" id="idNumber" name="idNumber" th:value="${idNumber}" required maxlength="20" inputmode="numeric"></div>
          <div class="col-6"><label class="form-label" for="phone">Celular</label>
            <input class="form-control" id="phone" name="phone" th:value="${phone}" required maxlength="20" inputmode="tel"></div>
        </div>
        <div class="mb-2"><label class="form-label" for="username">Usuario para entrar</label>
          <input class="form-control" id="username" name="username" th:value="${username}" required maxlength="30" autocapitalize="none"></div>
        <div class="row g-2 mb-2">
          <div class="col-6"><label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" required autocomplete="new-password"></div>
          <div class="col-6"><label class="form-label" for="confirmation">Repítela</label>
            <input class="form-control" id="confirmation" name="confirmation" type="password" required autocomplete="new-password"></div>
        </div>
        <p class="small text-soft">Mínimo 8 caracteres, con letras y números.</p>
        <details class="mb-2 small" th:if="${policy}"><summary>Política de tratamiento de datos y ubicación (versión <span th:text="${policy.version}"></span>)</summary>
          <div class="policy-text" th:text="${policy.text}"></div></details>
        <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="accepted" name="accepted" value="true" required>
          <label class="form-check-label small" for="accepted">Acepto que mi ubicación se registre mientras esté en servicio y el tratamiento de mis datos (Ley 1581 de 2012).</label></div>
        <button class="btn btn-primary w-100" type="submit">Enviar solicitud</button>
      </form>
    </div>
    <p class="text-center mt-3 small"><a th:href="@{/login}">Ya tengo cuenta</a></p>
  </div>
</div>
</body>
</html>
