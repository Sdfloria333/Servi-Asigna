<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cambiar contraseña')}"></head>
<body>
<div class="access">
  <div class="access-box">
    <div class="access-brand"><i class="bi bi-key-fill"></i><h1>Cambia tu contraseña</h1><p>La contraseña que tienes es temporal.</p></div>
    <div class="panel">
      <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
      <form th:action="@{/change-password}" method="post">
        <div class="mb-2"><label class="form-label" for="current">Contraseña actual (temporal)</label>
          <input class="form-control" id="current" name="current" type="password" required autocomplete="current-password"></div>
        <div class="mb-2"><label class="form-label" for="newPassword">Nueva contraseña</label>
          <input class="form-control" id="newPassword" name="newPassword" type="password" required autocomplete="new-password"></div>
        <div class="mb-3"><label class="form-label" for="confirmation">Repite la nueva</label>
          <input class="form-control" id="confirmation" name="confirmation" type="password" required autocomplete="new-password"></div>
        <button class="btn btn-primary w-100" type="submit">Guardar</button>
      </form>
      <form th:action="@{/logout}" method="post" class="mt-2"><button class="btn btn-link btn-sm w-100" type="submit">Salir</button></form>
    </div>
  </div>
</div>
</body>
</html>
