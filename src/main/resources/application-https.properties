# Perfil "https": necesario para usar el GPS y el micrófono (radio) desde un celular en la red local.
# Los navegadores solo permiten GPS y micrófono en https:// o en localhost.
#   mvn spring-boot:run -Dspring-boot.run.profiles=https
#   y en el celular: https://IP-DE-TU-PC:8443  (acepta la advertencia del certificado: es de prueba)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:despacho-https.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=despacho
server.ssl.key-alias=despacho
