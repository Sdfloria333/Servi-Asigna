server.port=8080
spring.application.name=despacho

# =====================================================================
# Base de datos: Oracle XE (18c o superior)
# Crea primero el usuario con db/oracle/00_crear_usuario.sql (como SYSTEM).
# Las tablas las crea sola la aplicación al arrancar (db/migracion/V*.sql).
# Puedes cambiar estos valores con variables de entorno sin tocar el archivo:
#   DB_URL, DB_USUARIO, DB_CLAVE
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USUARIO:DESPACHO}
spring.datasource.password=${DB_CLAVE:Despacho2026}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# Hibernate no toca el esquema: lo manejan los scripts versionados (MigradorEsquema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Las fechas se guardan en hora de Colombia (RN-17)
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.thymeleaf.cache=false

# =====================================================================
# Seguridad
# =====================================================================
# Secreto con el que se firman los tokens JWT (mínimo 32 caracteres). En producción: variable JWT_SECRETO.
despacho.jwt.secreto=${JWT_SECRETO:cambia-este-secreto-de-desarrollo-por-uno-largo-y-aleatorio-2026}
# Cuántas horas dura la sesión antes de pedir login otra vez
despacho.jwt.horas=10
# Cuentas que se crean solas la primera vez (cámbiales la clave en producción)
#   admin   / admin123     -> ADMIN (cuentas, configuración)
#   central / central123   -> DESPACHADOR (operación)
despacho.admin-inicial.clave=${ADMIN_CLAVE:admin123}
despacho.despachador-inicial.clave=${DESPACHADOR_CLAVE:central123}
# Datos de prueba: domiciliarios juan, maria, pedro, ana (clave domi1234), luis (pendiente) y dos clientes.
# Ponlo en false antes de usar el sistema de verdad.
despacho.datos-demo=true

# =====================================================================
# Dónde operamos: Valledupar, Cesar
# =====================================================================
# Centro del mapa y punto de partida de quien aún no manda GPS
despacho.centro.lat=10.4631
despacho.centro.lng=-73.2532
# Rectángulo de operación: no se aceptan servicios fuera de él (RF-M3-02)
despacho.area.lat-min=10.38
despacho.area.lat-max=10.56
despacho.area.lng-min=-73.36
despacho.area.lng-max=-73.15

# =====================================================================
# Reglas opcionales del motor (además de las que siempre aplican)
# Los demás parámetros de operación (tiempos, ofertas, GPS, mapa, línea base)
# se editan en la pantalla Configuración y quedan en la tabla PARAMETRO.
# =====================================================================
despacho.reglas.max-servicios.activa=false
despacho.reglas.max-servicios.maximo=4
despacho.reglas.balance-carga.activa=false

# Mensajes de error claros y sin detalles internos
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.co.despacho=INFO
